name: Validate public Skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_public.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/rico-short-video/scripts/test_closeout.py
