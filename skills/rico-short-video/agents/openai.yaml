interface:
  display_name: "Rico 口播与拍屏视频制作"
  short_description: "口播、拍屏与混合短片：真实素材优先、透明PNG补充、代码逻辑最后，统一MG镜头与动态"
  default_prompt: "使用 $rico-short-video，根据实际原片选择露脸口播、拍屏讲解或混合模式；动画先真实素材、次精致透明PNG、后代码逻辑，统一MG空间镜头与动态并核对素材关卡；已有原片直接分析剪辑，交付时备齐视频、独立封面、文案及发布交接清单；发布环节先检测独立 $yixiaoer 技能，缺失先安装，有则直接调用并沿用本次已有发布授权；我明确说任务完成后复盘归档，通用改进先形成可审核建议。"
