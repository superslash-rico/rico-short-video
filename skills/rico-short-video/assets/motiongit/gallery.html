function safe(url){try{const u=new URL(url);return u.protocol==='https:'&&['motiongit.com','media.openaicut.com'].includes(u.hostname)&&!u.username&&!u.password?u.href:''}catch{return ''}}
function render(){grid.replaceChildren();const q=document.getElementById('search').value.trim().toLowerCase();const rows=DATA.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('count').textContent=`${rows.length} 项参考 · 目录快照：2026-10-16`;
for(const item of rows){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.loading='lazy';img.alt=item.name;if(safe(item.cover))img.src=safe(item.cover);card.append(img);const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=item.name;body.append(h);const meta=document.createElement('p');meta.className='meta';meta.textContent=[item.author,item.ratio,item.category].filter(Boolean).join(' · ');body.append(meta);const b=document.createElement('button');b.textContent=item.previewKind;b.onclick=()=>{b.disabled=true;const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='none';v.src=safe(item.preview);body.append(v);v.play().catch(()=>{})};body.append(b);const a=document.createElement('a');a.href=safe(item.url);a.target='_blank';a.rel='noopener noreferrer';a.textContent='官网与许可';body.append(a);card.append(body);grid.append(card)}}document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
